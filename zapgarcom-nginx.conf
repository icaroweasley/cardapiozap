server {
    server_name zapgarcom.com.br www.zapgarcom.com.br;
    client_max_body_size 50M;

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        proxy_pass http://localhost:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/zapgarcom.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/zapgarcom.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    server_name api.zapgarcom.com.br;
    client_max_body_size 50M;

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/zapgarcom.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/zapgarcom.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = www.zapgarcom.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = zapgarcom.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name zapgarcom.com.br www.zapgarcom.com.br;
    listen 80;
    return 404; # managed by Certbot




}

server {
    if ($host = api.zapgarcom.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name api.zapgarcom.com.br;
    listen 80;
    return 404; # managed by Certbot


}
